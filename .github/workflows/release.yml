name: Attach Release Zip

# Builds a production zip from the release tag and attaches it to the GitHub release.
# Fires for both releases and pre-releases.

on:
    release:
        types: [ published ]

jobs:
    build:
        # GITHUB_TOKEN needs write access to attach the asset; repo default is read-only.
        permissions:
            contents: write
        uses: impress-org/givewp-github-actions/.github/workflows/pre-release.yml@master
        with:
            plugin_slug: give-data-generator
            zip_name: give-data-generator.${{ github.event.release.tag_name }}
        secrets: inherit
