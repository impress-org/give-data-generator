name: Publish benchmark report

# Serves benchmarks/report.html at https://impress-org.github.io/give-data-generator/ so the team
# can read the latest numbers without a checkout. The page is regenerated from the saved results
# on every change to them.

on:
    push:
        branches: [main]
        paths: ['benchmarks/**', 'bin/report.php']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    persist-credentials: false

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.3
                    coverage: none

            # bin/report.php is plain PHP with no dependencies; results/ is published alongside so
            # anyone can pull the JSON the charts came from.
            -   name: Build the page
                run: |
                    mkdir -p _site
                    php bin/report.php _site/index.html
                    cp -r benchmarks/results _site/results

            -   uses: actions/upload-pages-artifact@v3
                with:
                    path: _site

            -   id: deploy
                uses: actions/deploy-pages@v4
